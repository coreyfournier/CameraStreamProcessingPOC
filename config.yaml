cameras:
  - id: 15
    label: "Reolink E1 Pro"
    source_type: "rtsp"
    rtsp:
      ip: "${ONVIF_IP}"
      port: 554
      username: "${ONVIF_USERNAME}"
      password: "${ONVIF_PASSWORD}"
      path: "/h264Preview_01_main"

synology:
  ip: "${SYNOLOGY_IP}"
  port: "${SYNOLOGY_PORT}"
  username: "${SYNOLOGY_USERNAME}"
  password: "${SYNOLOGY_PASSWORD}"
  secure: true
  cert_verify: true
  dsm_version: 7

detection:
  confidence_threshold: 0.5
  encodings_path: "./faces-output/encodings.pkl"
  match_tolerance: 0.9
  match_skip_frames: 5
  match_min_confidence: 0.5

smoothing:
  window_size: 15
  min_hit_ratio: 0.3
  min_avg_confidence: 0.4

redis:
  host: "redis"
  port: 6379
  stream_name: "person_detections"

database:
  path: "./data/surveillance.db"

storage:
  person_images_dir: "./recordings/persons"

recording:
  enabled: true
  output_dir: "./recordings"
  clip_duration: 30

retention:
  days: 3
  cleanup_interval_hours: 24

api:
  host: "0.0.0.0"
  port: 8000

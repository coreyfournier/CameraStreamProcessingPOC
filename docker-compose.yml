services:
  redis:
    image: redis:7.4-alpine3.21
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    # restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./faces-output:/app/faces-output:ro
      - ./examples:/app/examples:ro
      - recordings:/app/recordings
    env_file: .env

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - recordings:/app/recordings
      - db-data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      - consumer
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - recordings:/app/recordings:ro
      - db-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  redis-data:
  recordings:
  db-data:
